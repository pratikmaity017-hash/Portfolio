<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfolio administrator login" />
    <title>Admin Login | Portfolio</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <main class="login-page">
      <section class="login-card">
        <a href="../index.html" class="brand">
          <span class="brand-icon">P</span>
          <span>Portfolio Admin</span>
        </a>

        <div class="login-heading">
          <span class="eyebrow">ADMINISTRATION</span>
          <h1>Welcome back</h1>
          <p>Sign in to manage your portfolio projects.</p>
        </div>

        <form id="loginForm">
          <div class="form-group">
            <label for="email">Email address</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="admin@example.com"
              autocomplete="username"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            />
          </div>

          <p
            id="loginMessage"
            class="login-message"
            role="status"
            aria-live="polite"
          ></p>

          <button type="submit" class="login-button">
            Sign In <span aria-hidden="true">→</span>
          </button>
        </form>

        <p class="security-note">
          <span aria-hidden="true">◆</span>
          Restricted access for the portfolio administrator.
        </p>

        <a href="../index.html" class="back-link"> ← Back to portfolio </a>
      </section>

      <footer class="login-footer">Portfolio Management System</footer>
    </main>

    <script src="login.js"></script>
  </body>
</html>
